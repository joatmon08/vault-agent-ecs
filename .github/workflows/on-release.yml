name: on-release

on:
  release:
    types:
      - released
      - prereleased

permissions:
  contents: read
  id-token: write

env:
  ECR_URI: 071562980661.dkr.ecr.ap-southeast-1.amazonaws.com/vault-agent-ecs
  PUBLISH_ROLE: arn:aws:iam::071562980661:role/github-actions/gha-vault-agent-ecs
  ARTIFACT_ACCOUNT_ID: "071562980661"

jobs:
  publish:
    runs-on:
      - self-hosted
      - platform-eng-ent

    outputs:
      image_uri: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.PUBLISH_ROLE }}
          aws-region: ap-southeast-1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'
          registries: ${{ env.ARTIFACT_ACCOUNT_ID }}

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_URI }}
          tags: type=raw,value={{tag}}

      - name: Build and Push
        id: publish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ github.workspace }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
